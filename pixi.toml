[workspace]
name = "biostat707-checkpoint1"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
r-base = ">=4.4,<4.7"
quarto = ">=1.7"
r-knitr = "*"
r-rmarkdown = "*"
r-readr = "*"
r-dplyr = "*"
r-tidyr = "*"
r-ggplot2 = "*"
r-gtsummary = "*"
r-naniar = "*"
r-visdat = "*"
r-here = "*"

[tasks]
build-long = "Rscript R/01_build_long.R"

explore-long = "Rscript R/02_explore_long.R"

build-wide = "Rscript R/03_build_wide.R"

cohort-eda = "Rscript R/04_cohort_eda.R"

build-all = "Rscript R/01_build_long.R && Rscript R/02_explore_long.R && Rscript R/03_build_wide.R && Rscript R/04_cohort_eda.R"

render = "quarto render checkpoint1.qmd"

checkpoint1 = "Rscript R/01_build_long.R && Rscript R/02_explore_long.R && Rscript R/03_build_wide.R && Rscript R/04_cohort_eda.R && quarto render checkpoint1.qmd"